<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brothrone Travel — 글쓰기</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#fff; --ink:#16181d; --muted:#6b7280; --line:#e4e7ec;
  --accent:#2563eb; --accent-soft:#eff5ff; --ok:#15803d; --warn:#b45309; --err:#b91c1c;
  --warn-bg:#fffbeb; --err-bg:#fef2f2; --radius:10px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f1115; --panel:#171a21; --ink:#e7e9ee; --muted:#9aa3b2; --line:#272b35;
    --accent:#60a5fa; --accent-soft:#16233a; --ok:#4ade80; --warn:#fbbf24; --err:#f87171;
    --warn-bg:#2a2113; --err-bg:#2b1517;
  }
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",sans-serif;
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}

/* ── 헤더 ── */
header{
  position:sticky; top:0; z-index:20; background:var(--panel);
  border-bottom:1px solid var(--line); padding:10px 16px;
  display:flex; gap:10px; align-items:center; flex-wrap:wrap;
}
header h1{font-size:15px;margin:0 12px 0 0;font-weight:700;white-space:nowrap}
header h1 span{color:var(--muted);font-weight:400}
.field{display:flex;align-items:center;gap:6px}
.field label{font-size:12px;color:var(--muted);white-space:nowrap}
input,select,textarea{
  background:var(--bg); border:1px solid var(--line); border-radius:8px;
  padding:7px 10px; outline:none;
}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
#slug{width:190px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
#date{width:145px}
.spacer{flex:1}
.badge{font-size:12px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);white-space:nowrap}
.badge.ok{color:var(--ok);border-color:currentColor}
.badge.warn{color:var(--warn);border-color:currentColor}
.badge.err{color:var(--err);border-color:currentColor}

/* ── 본문 ── */
main{padding:16px;display:flex;flex-direction:column;gap:16px;max-width:1600px;margin:0 auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.panel>h2{
  margin:0;padding:11px 14px;font-size:13px;font-weight:700;
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;
}
.panel>h2 .sub{font-weight:400;color:var(--muted);font-size:12px}
.editors{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:1000px){.editors{grid-template-columns:1fr}}
.pane-body{padding:14px;display:flex;flex-direction:column;gap:10px}
.pane-body input,.pane-body textarea{width:100%}
.counter{font-size:11px;color:var(--muted);text-align:right;margin-top:-6px}
.counter.over{color:var(--err)}
textarea.body{
  min-height:420px;resize:vertical;line-height:1.7;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13.5px;
}
.toolbar{display:flex;gap:5px;flex-wrap:wrap}
.toolbar button{
  background:var(--bg);border:1px solid var(--line);border-radius:7px;
  padding:4px 9px;font-size:12px;color:var(--muted);
}
.toolbar button:hover{border-color:var(--accent);color:var(--accent)}
.hint{font-size:11.5px;color:var(--muted)}

/* ── 사진 ── */
#drop{
  margin:14px;padding:22px;border:2px dashed var(--line);border-radius:var(--radius);
  text-align:center;color:var(--muted);font-size:13px;transition:.15s;
}
#drop.hot{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.photo-actions{padding:0 14px 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{
  padding:0 14px 14px;display:grid;gap:12px;
  grid-template-columns:repeat(auto-fill,minmax(168px,1fr));
}
.card{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--bg);position:relative}
.card.is-hero{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.card .thumb{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--line)}
.card .meta{padding:8px;display:flex;flex-direction:column;gap:6px}
.card .meta input{width:100%;padding:5px 8px;font-size:12.5px}
.card .fname{
  font-size:11px;color:var(--accent);font-family:ui-monospace,Menlo,monospace;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.card .row{display:flex;gap:4px}
.card .row button{
  flex:1;background:var(--panel);border:1px solid var(--line);border-radius:6px;
  padding:4px;font-size:11px;color:var(--muted);
}
.card .row button:hover{border-color:var(--accent);color:var(--accent)}
.card .corner{position:absolute;top:6px;right:6px;display:flex;gap:4px}
.card .corner button{
  width:26px;height:26px;border-radius:6px;border:none;font-size:13px;
  background:rgba(0,0,0,.58);color:#fff;display:grid;place-items:center;
}
.card .corner button.on{background:var(--accent)}
.chips{display:flex;gap:5px;flex-wrap:wrap;padding:0 14px 14px}
.chips button{
  background:var(--bg);border:1px solid var(--line);border-radius:99px;
  padding:4px 11px;font-size:12px;color:var(--muted);
}
.chips button:hover{border-color:var(--accent);color:var(--accent)}

/* ── 검증 ── */
#issues{display:flex;flex-direction:column;gap:6px;padding:0 14px 14px}
.issue{font-size:13px;padding:8px 11px;border-radius:8px;border:1px solid}
.issue.error{background:var(--err-bg);border-color:var(--err);color:var(--err)}
.issue.warn{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}

/* ── 발행 바 ── */
footer{
  position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);
  padding:11px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;z-index:20;
}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 15px;font-size:13.5px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.check{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}

/* ── 모달 ── */
.modal{
  position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;
  place-items:center;z-index:50;padding:20px;
}
.modal.open{display:grid}
.modal .box{
  background:var(--panel);border-radius:14px;max-width:760px;width:100%;
  max-height:86vh;overflow:auto;border:1px solid var(--line);
}
.modal .box h3{margin:0;padding:15px 18px;border-bottom:1px solid var(--line);font-size:15px}
.modal .box .inner{padding:18px;display:flex;flex-direction:column;gap:12px}
.modal .box .foot{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
pre.log{
  background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;
  font-size:12px;font-family:ui-monospace,Menlo,monospace;white-space:pre-wrap;
  max-height:340px;overflow:auto;margin:0;
}
.preview{padding:18px;line-height:1.75}
.preview img{max-width:100%;border-radius:8px;margin:10px 0}
.preview h2{font-size:19px;margin:26px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.preview h3{font-size:16px;margin:20px 0 8px}
.preview p{margin:10px 0}
</style>
</head>
<body>

<header>
  <h1>✍️ Brothrone <span>글쓰기</span></h1>
  <div class="field">
    <label>카테고리</label>
    <select id="category"></select>
  </div>
  <div class="field">
    <label>슬러그</label>
    <input id="slug" placeholder="nikko-kanaya" autocomplete="off">
  </div>
  <div class="field">
    <label>날짜</label>
    <input id="date" type="date">
  </div>
  <div class="spacer"></div>
  <span class="badge" id="status">준비</span>
</header>

<main>
  <!-- 사진 -->
  <section class="panel">
    <h2>🖼 사진 <span class="sub" id="photoCount">0장</span>
      <span class="sub" id="folderHint"></span></h2>
    <div id="drop">사진을 여기로 드래그하거나 <button class="btn" id="pickBtn" style="padding:5px 12px">파일 선택</button>
      <input type="file" id="picker" multiple accept="image/*" hidden>
    </div>
    <div class="photo-actions">
      <button class="btn" id="loadFolder">📂 폴더에서 불러오기</button>
      <button class="btn" id="insertAll">📝 전체를 본문 뼈대로 삽입</button>
      <button class="btn" id="clearPhotos">비우기</button>
      <span class="hint">라벨을 정하면 파일명이 자동으로 만들어집니다 · ⭐ = 대표 이미지</span>
    </div>
    <div class="chips" id="chips"></div>
    <div class="grid" id="grid"></div>
  </section>

  <!-- 에디터 -->
  <section class="editors">
    <div class="panel">
      <h2>🇰🇷 한국어 <span class="sub" id="koPath"></span></h2>
      <div class="pane-body">
        <input id="title_ko" placeholder="제목 (앞의 [숙박후기] 는 자동으로 붙습니다)">
        <input id="tags_ko" placeholder="태그 (쉼표로 구분) — 예: 일본, 닛코, 온천">
        <textarea id="desc_ko" rows="2" placeholder="메타 description (검색 결과에 보이는 설명, 160자 이내)"></textarea>
        <div class="counter" id="c_desc_ko">0 / 160</div>
        <div class="toolbar" data-target="body_ko">
          <button data-md="## ">## 소제목</button>
          <button data-md="**|**">굵게</button>
          <button data-md="- ">목록</button>
          <button data-md="> ">인용</button>
          <button data-preview="ko">👁 미리보기</button>
        </div>
        <textarea class="body" id="body_ko" placeholder="본문을 마크다운으로 작성하세요.

## 외관

사진은 위에서 [본문 삽입] 버튼으로 넣을 수 있습니다."></textarea>
      </div>
    </div>

    <div class="panel">
      <h2>🌐 English <span class="sub" id="enPath"></span></h2>
      <div class="pane-body">
        <input id="title_en" placeholder="Title — e.g. Nikko Kanaya Hotel Review (2026)">
        <input id="tags_en" placeholder="Tags (comma separated) — e.g. Japan, Nikko, Onsen">
        <textarea id="desc_en" rows="2" placeholder="Meta description (max 160 chars)"></textarea>
        <div class="counter" id="c_desc_en">0 / 160</div>
        <div class="toolbar" data-target="body_en">
          <button data-md="## ">## Heading</button>
          <button data-md="**|**">Bold</button>
          <button data-md="- ">List</button>
          <button data-md="> ">Quote</button>
          <button data-preview="en">👁 Preview</button>
        </div>
        <textarea class="body" id="body_en" placeholder="Write the English version here.

비워두면 한국어 글만 발행됩니다."></textarea>
      </div>
    </div>
  </section>

  <!-- 검증 -->
  <section class="panel" id="issuePanel" style="display:none">
    <h2>🔎 발행 전 점검</h2>
    <div id="issues"></div>
  </section>
</main>

<footer>
  <span class="hint" id="saveHint">자동 저장됨</span>
  <button class="btn" id="newBtn">📄 새 글</button>
  <div class="spacer"></div>
  <label class="check"><input type="checkbox" id="doPush" checked> 발행 후 푸시 (자동 배포)</label>
  <button class="btn" id="checkBtn">점검하기</button>
  <button class="btn primary" id="publishBtn">🚀 발행하기</button>
</footer>

<!-- 발행 확인 모달 -->
<div class="modal" id="modal">
  <div class="box">
    <h3 id="modalTitle">발행 확인</h3>
    <div class="inner" id="modalBody"></div>
    <div class="foot" id="modalFoot"></div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const el = (t,c,x) => { const n=document.createElement(t); if(c)n.className=c; if(x!=null)n.textContent=x; return n; };

let CFG = {categories:{},labels:{},slugs:[]};
let photos = [];          // {src,name,label,hero,thumbUrl,fromFolder}
let lastEditor = 'body_ko';
let dirty = false;

const F = ['category','slug','date','title_ko','title_en','tags_ko','tags_en','desc_ko','desc_en','body_ko','body_en'];

// ───────── 초기화 ─────────
(async function init(){
  CFG = await (await fetch('/api/config')).json();
  const sel = $('#category');
  for (const [k,v] of Object.entries(CFG.categories)) {
    sel.append(new Option(`${v.ko} (${k})`, k));
  }
  $('#date').value = CFG.today;

  const draft = await (await fetch('/api/draft')).json();
  if (draft && draft.slug) {
    F.forEach(k => { if (draft[k] != null && $('#'+k)) $('#'+k).value = draft[k]; });
    photos = (draft.photos||[]).map(p => ({...p, thumbUrl: thumbFor(p)}));
  }
  renderChips(); renderPhotos(); updatePaths(); count();
})();

function thumbFor(p){
  return p.thumbUrl || ('/api/thumb?path=' + encodeURIComponent(p.src) + '&v=' + Date.now());
}

// ───────── 상태/자동저장 ─────────
function collect(){
  const d = {};
  F.forEach(k => d[k] = $('#'+k) ? $('#'+k).value : '');
  d.tags_ko = splitTags(d.tags_ko);
  d.tags_en = splitTags(d.tags_en);
  d.photos = photos.map(p => ({src:p.src, name:p.name, label:p.label, hero:!!p.hero}));
  return d;
}
const splitTags = s => (s||'').split(',').map(t=>t.trim()).filter(Boolean);

function mark(){ dirty = true; $('#saveHint').textContent='저장 중…'; }
setInterval(async () => {
  if (!dirty) return;
  dirty = false;
  const d = collect();
  d.tags_ko = $('#tags_ko').value; d.tags_en = $('#tags_en').value;
  await fetch('/api/draft',{method:'POST',body:JSON.stringify(d)});
  $('#saveHint').textContent = '자동 저장됨 · ' + new Date().toLocaleTimeString('ko-KR');
}, 2500);

document.addEventListener('input', e => {
  if (e.target.closest('header, .pane-body, .card')) { mark(); count(); }
  if (e.target.id==='slug' || e.target.id==='category' || e.target.id==='date') updatePaths();
});
$('#category').addEventListener('change', () => { renderChips(); renderPhotos(); updatePaths(); });
['body_ko','body_en'].forEach(id => $('#'+id).addEventListener('focus', () => lastEditor = id));

function count(){
  [['desc_ko','c_desc_ko'],['desc_en','c_desc_en']].forEach(([a,b])=>{
    const n = $('#'+a).value.length;
    $('#'+b).textContent = `${n} / 160`;
    $('#'+b).classList.toggle('over', n>160);
  });
}

function updatePaths(){
  const cat = $('#category').value, slug = $('#slug').value.trim(), date = $('#date').value;
  $('#koPath').textContent = slug ? `_posts/${cat}/${date}-${slug}.md` : '';
  $('#enPath').textContent = slug ? `_en_posts/${cat}/${date}-${slug}-en.md` : '';
  const dup = CFG.slugs.includes(slug);
  const s = $('#status');
  if (!slug)      { s.className='badge';      s.textContent='슬러그를 입력하세요'; }
  else if (dup)   { s.className='badge err';  s.textContent='⚠ 같은 슬러그의 글이 이미 있습니다'; }
  else            { s.className='badge ok';   s.textContent='새 글'; }
  $('#folderHint').textContent = slug ? `assets/images/${cat}/${slug}/` : '';
  renderPhotos();
}

// ───────── 사진 ─────────
// 라벨 → 한글 표시. 직접 타이핑한 라벨도 프리셋과 맞으면 한글 제목을 쓴다
function altFor(p){
  const presets = CFG.labels[$('#category').value] || [];
  const hit = presets.find(([name]) => name === (p.label||'').trim().toLowerCase());
  return hit ? hit[1] : (p.label||'').trim();
}

function renderChips(){
  const box = $('#chips'); box.innerHTML='';
  const presets = CFG.labels[$('#category').value] || [];
  if (!presets.length) return;
  box.append(el('span','hint','라벨 빠른 지정 — 사진을 고른 뒤 클릭:'));
  presets.forEach(([name,ko]) => {
    const b = el('button', null, `${ko}`);
    b.title = name + '.webp';
    b.onclick = () => {
      const target = photos.find(p => p.selected) || photos.find(p => !p.label);
      if (!target) return;
      target.label = name; target.selected = false;
      mark(); renderPhotos();
    };
    box.append(b);
  });
}

function resolveNames(){
  const used = {};
  return photos.map(p => {
    const base = (p.label||'photo').toLowerCase().replace(/[^a-z0-9_-]/g,'_');
    used[base] = (used[base]||0)+1;
    return base + (used[base]>1 ? used[base] : '') + '.webp';
  });
}

function renderPhotos(){
  const grid = $('#grid'); grid.innerHTML='';
  const names = resolveNames();
  const cat = $('#category').value, slug = $('#slug').value.trim();
  $('#photoCount').textContent = photos.length + '장';

  photos.forEach((p,i) => {
    const c = el('div','card' + (p.hero?' is-hero':'') + (p.selected?' is-sel':''));
    if (p.selected) c.style.outline = '2px solid var(--accent)';

    const img = el('img','thumb');
    img.src = p.thumbUrl; img.loading='lazy'; img.alt = p.name||'';
    img.onclick = () => { photos.forEach((q,j)=>q.selected = (j===i && !p.selected)); renderPhotos(); };
    c.append(img);

    const corner = el('div','corner');
    const star = el('button', p.hero?'on':null, '★'); star.title='대표 이미지로 지정';
    star.onclick = () => { photos.forEach((q,j)=>q.hero = (j===i && !p.hero)); mark(); renderPhotos(); };
    const del = el('button',null,'✕'); del.title='제거';
    del.onclick = () => { photos.splice(i,1); mark(); renderPhotos(); };
    corner.append(star, del); c.append(corner);

    const meta = el('div','meta');
    const inp = el('input'); inp.placeholder='라벨 (예: room)'; inp.value = p.label||'';
    inp.oninput = () => { p.label = inp.value; mark();
      c.querySelector('.fname').textContent = '→ ' + resolveNames()[i]; };
    meta.append(inp);
    meta.append(el('div','fname','→ ' + names[i]));

    const row = el('div','row');
    const ins = el('button',null,'본문 삽입');
    ins.onclick = () => {
      if (!slug) return alert('먼저 슬러그를 입력하세요.');
      const alt = lastEditor === 'body_ko' ? altFor(p) : (p.label||'');
      insert(lastEditor, `\n![${alt}](/assets/images/${cat}/${slug}/${resolveNames()[i]})\n`);
    };
    const left = el('button',null,'←'); left.onclick = () => move(i,-1);
    const right= el('button',null,'→'); right.onclick = () => move(i, 1);
    row.append(left, ins, right); meta.append(row);

    c.append(meta); grid.append(c);
  });
}

function move(i,d){
  const j = i+d; if (j<0||j>=photos.length) return;
  [photos[i],photos[j]] = [photos[j],photos[i]]; mark(); renderPhotos();
}

function insert(id, text){
  const t = $('#'+id);
  const s = t.selectionStart ?? t.value.length;
  t.value = t.value.slice(0,s) + text + t.value.slice(t.selectionEnd ?? s);
  t.focus(); t.selectionStart = t.selectionEnd = s + text.length;
  mark();
}

// 업로드
async function addFiles(files){
  for (const f of files) {
    if (!f.type.startsWith('image/')) continue;
    const data = await new Promise(r => { const fr=new FileReader(); fr.onload=()=>r(fr.result); fr.readAsDataURL(f); });
    const res = await (await fetch('/api/upload',{method:'POST',body:JSON.stringify({name:f.name,data})})).json();
    photos.push({src:res.src, name:f.name, label:'', thumbUrl:data});
    renderPhotos();
  }
  mark();
}
$('#pickBtn').onclick = () => $('#picker').click();
$('#picker').onchange = e => addFiles(e.target.files);
const drop = $('#drop');
['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => {e.preventDefault();drop.classList.add('hot')}));
['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => {e.preventDefault();drop.classList.remove('hot')}));
drop.addEventListener('drop', e => addFiles(e.dataTransfer.files));
// 드롭존 밖에 사진을 떨어뜨리면 브라우저가 그 파일로 이동해 작성 중인 글이 날아간다.
// 드롭존 핸들러가 먼저 실행된 뒤 여기서 기본 동작만 막는다.
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => e.preventDefault());

$('#loadFolder').onclick = async () => {
  const cat = $('#category').value, slug = $('#slug').value.trim();
  if (!slug) return alert('먼저 슬러그를 입력하세요.');
  const r = await (await fetch(`/api/folder?category=${cat}&slug=${encodeURIComponent(slug)}`)).json();
  if (!r.images.length) return alert(`assets/images/${cat}/${slug}/ 에 사진이 없습니다.`);
  const have = new Set(photos.map(p=>p.src));
  r.images.filter(i=>!have.has(i.src)).forEach(i => photos.push({
    src:i.src, name:i.name, label: i.converted ? i.name.replace(/\.webp$/,'') : '',
    fromFolder:true, thumbUrl:'/api/thumb?path='+encodeURIComponent(i.src)
  }));
  mark(); renderPhotos();
};

$('#clearPhotos').onclick = () => { if(confirm('사진 목록을 비울까요? (파일은 지워지지 않습니다)')) {photos=[];mark();renderPhotos();} };

$('#insertAll').onclick = () => {
  const cat=$('#category').value, slug=$('#slug').value.trim();
  if (!slug) return alert('먼저 슬러그를 입력하세요.');
  if (!photos.length) return alert('사진이 없습니다.');
  const names = resolveNames();
  const ko = photos.map((p,i)=>`## ${altFor(p)||'제목'}\n\n![${altFor(p)}](/assets/images/${cat}/${slug}/${names[i]})\n\n`).join('');
  const en = photos.map((p,i)=>`## ${cap(p.label||'Section')}\n\n![${p.label||''}](/assets/images/${cat}/${slug}/${names[i]})\n\n`).join('');
  $('#body_ko').value += (($('#body_ko').value.trim()?'\n\n':'') + ko);
  $('#body_en').value += (($('#body_en').value.trim()?'\n\n':'') + en);
  mark();
};
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);

// 툴바
document.querySelectorAll('.toolbar').forEach(tb => {
  const target = tb.dataset.target;
  tb.querySelectorAll('button').forEach(b => {
    b.onclick = () => {
      if (b.dataset.preview) return preview(b.dataset.preview);
      const md = b.dataset.md;
      if (md.includes('|')) {
        const t=$('#'+target), s=t.selectionStart, e=t.selectionEnd;
        const [a,z]=md.split('|');
        t.value = t.value.slice(0,s)+a+t.value.slice(s,e)+z+t.value.slice(e);
        t.focus(); t.selectionStart=s+a.length; t.selectionEnd=e+a.length;
      } else insert(target, md);
      mark();
    };
  });
});

// ───────── 미리보기 ─────────
function md2html(md){
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  return esc(md)
    .replace(/^### (.*)$/gm,'<h3>$1</h3>')
    .replace(/^## (.*)$/gm,'<h2>$1</h2>')
    .replace(/^&gt; (.*)$/gm,'<blockquote>$1</blockquote>')
    .replace(/!\[([^\]]*)\]\(([^)]+)\)/g,'<img alt="$1" src="$2">')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/^- (.*)$/gm,'<li>$1</li>')
    .split(/\n{2,}/).map(b => /^<(h2|h3|img|li|blockquote)/.test(b.trim()) ? b : `<p>${b.replace(/\n/g,'<br>')}</p>`)
    .join('\n');
}
function preview(lang){
  const body = $('#body_'+lang).value;
  const title = $('#title_'+lang).value;
  openModal(lang==='ko'?'미리보기':'Preview',
    `<div class="preview"><h1 style="font-size:22px;margin:0 0 14px">${title||'(제목 없음)'}</h1>${md2html(body)}</div>`,
    [['닫기', closeModal]]);
}

// ───────── 점검 / 발행 ─────────
async function check(){
  const r = await (await fetch('/api/validate',{method:'POST',body:JSON.stringify(collect())})).json();
  const box = $('#issues'); box.innerHTML='';
  $('#issuePanel').style.display = r.issues.length ? '' : 'none';
  r.issues.forEach(i => box.append(el('div','issue '+(i.level==='error'?'error':'warn'),
    (i.level==='error'?'❌ ':'⚠️ ')+i.msg)));
  if (!r.issues.length) {
    $('#issuePanel').style.display='';
    box.append(el('div','issue warn','✅ 문제 없습니다. 발행할 수 있습니다.'));
    box.lastChild.style.color='var(--ok)'; box.lastChild.style.borderColor='var(--ok)';
    box.lastChild.style.background='transparent';
  }
  return r.issues;
}
$('#checkBtn').onclick = check;

let needOverwrite = false;

$('#publishBtn').onclick = async () => {
  const issues = await check();
  const errs = issues.filter(i => i.level === 'error');
  // '이미 발행된 글' 은 확인만 받으면 진행 가능, 나머지 오류는 발행 자체를 막는다
  needOverwrite = errs.some(i => i.code === 'exists');
  const blocking = errs.filter(i => i.code !== 'exists');
  if (blocking.length) { window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'}); return; }

  const d = collect();
  const names = resolveNames();
  const push = $('#doPush').checked;
  const list = photos.map((p,i)=>`  ${p.name||p.src.split('/').pop()}  →  ${names[i]}${p.hero?'   ⭐대표':''}`).join('\n');

  openModal(needOverwrite ? '⚠️ 덮어쓰기 확인' : '발행 확인', `
    ${needOverwrite ? `<div class="issue error">
      <b>이미 발행된 글을 덮어씁니다.</b><br>
      <code>${d.date}-${d.slug}</code> 의 기존 내용은 사라지고 되돌릴 수 없습니다.
      새 글이라면 <b>취소</b>하고 슬러그나 날짜를 바꾸세요.
      <label style="display:flex;gap:7px;align-items:center;margin-top:9px;font-weight:600">
        <input type="checkbox" id="owAgree"> 기존 글을 덮어쓰는 데 동의합니다
      </label></div>` : '<div>다음 내용으로 발행합니다.</div>'}
    <pre class="log">글:
  _posts/${d.category}/${d.date}-${d.slug}.md
  ${d.body_en.trim()? `_en_posts/${d.category}/${d.date}-${d.slug}-en.md` : '(영문 글 없음)'}

사진 ${photos.length}장 → assets/images/${d.category}/${d.slug}/
${list||'  (없음)'}

git: add → commit${push?' → push (자동 배포됨)':' (푸시 안 함)'}</pre>
    ${push?'<div class="issue warn">⚠️ 푸시하면 실제 사이트에 공개됩니다.</div>':''}
    <label style="font-size:13px;color:var(--muted)">커밋 메시지<input id="cmsg" style="width:100%;margin-top:5px" value="${needOverwrite?'Update':'Add'} ${d.slug} post"></label>
  `, [['취소', closeModal], [needOverwrite ? '덮어쓰고 발행' : '발행', doPublish, true]]);
};

async function doPublish(){
  if (needOverwrite && !($('#owAgree') && $('#owAgree').checked)) {
    alert('기존 글을 덮어쓰려면 동의 체크가 필요합니다.');
    return;
  }
  const d = collect();
  d.push = $('#doPush').checked;
  d.git = true;
  d.overwrite = needOverwrite;
  d.commit_msg = $('#cmsg') ? $('#cmsg').value : undefined;
  openModal('발행 중…', '<pre class="log">처리하고 있습니다…</pre>', []);
  const res = await fetch('/api/publish',{method:'POST',body:JSON.stringify(d)});
  const r = await res.json();
  if (!r.ok) {
    return openModal('발행 실패',
      `<pre class="log">${(r.issues? r.issues.map(i=>i.msg).join('\n') : (r.error+'\n\n'+(r.trace||'')))}</pre>`,
      [['닫기', closeModal]]);
  }
  CFG.slugs.push(d.slug);
  needOverwrite = false;
  openModal('발행 완료 🎉',
    `<pre class="log">${r.log.join('\n')}</pre>` +
    (r.git? `<details><summary style="cursor:pointer;font-size:13px;color:var(--muted)">git 로그 보기</summary><pre class="log">${r.git}</pre></details>`:'') +
    `<div class="hint">이 글은 발행됐습니다. 이어서 다른 글을 쓰려면 <b>새 글 쓰기</b>를 누르세요.</div>`,
    [['닫기', closeModal], ['새 글 쓰기', () => { resetAll(); closeModal(); }, true]]);
}

// 발행이 끝난 내용을 그대로 두면 모르고 다시 눌러 덮어쓰게 된다
function resetAll(){
  F.forEach(k => {
    if (k === 'category') return;
    const n = $('#'+k); if (!n) return;
    n.value = (k === 'date') ? CFG.today : '';
  });
  photos = []; needOverwrite = false;
  $('#issuePanel').style.display = 'none';
  renderPhotos(); updatePaths(); count();
  fetch('/api/draft', {method:'POST', body: JSON.stringify({})});
  $('#saveHint').textContent = '새 글';
  window.scrollTo({top:0, behavior:'smooth'});
}
$('#newBtn').onclick = () => {
  const has = $('#slug').value || $('#title_ko').value || $('#body_ko').value || photos.length;
  if (has && !confirm('지금 작성 중인 내용을 비우고 새 글을 시작할까요?')) return;
  resetAll();
};

// ───────── 모달 ─────────
function openModal(title, html, buttons){
  $('#modalTitle').textContent = title;
  $('#modalBody').innerHTML = html;
  const foot = $('#modalFoot'); foot.innerHTML='';
  (buttons||[]).forEach(([label, fn, primary]) => {
    const b = el('button','btn'+(primary?' primary':''), label);
    b.onclick = fn; foot.append(b);
  });
  $('#modal').classList.add('open');
}
function closeModal(){ $('#modal').classList.remove('open'); }
$('#modal').addEventListener('click', e => { if (e.target.id==='modal') closeModal(); });
document.addEventListener('keydown', e => { if (e.key==='Escape') closeModal(); });
</script>
